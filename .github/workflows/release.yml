name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply before releasing (none = re-release the latest tag)'
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: 'none'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate repository.url
        run: |
          PACKAGE_REPO_URL=$(node -p "require('./package.json').repository?.url ?? ''")
          CURRENT_REPO="${{ github.repository }}"
          if [ -n "$PACKAGE_REPO_URL" ] && [[ "$PACKAGE_REPO_URL" != *"$CURRENT_REPO"* ]]; then
            echo "ERROR: package.json repository.url ($PACKAGE_REPO_URL) does not point to this repository ($CURRENT_REPO)."
            echo "   Update repository.url before releasing."
            exit 1
          fi
          echo "repository.url OK ($PACKAGE_REPO_URL)"

      - name: Resolve tag (and bump version when requested)
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUMP" = "none" ]; then
            TAG=$(git tag --sort=-version:refname | grep '^v' | head -1)
            if [ -z "$TAG" ]; then
              echo "ERROR: No tags found in repository. Use bump: patch/minor/major to create the first release."
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(node -p "require('./meta.json').version")
          LATEST=$(git tag --sort=-version:refname | grep '^v' | head -1 || true)

          if [ -n "$LATEST" ]; then
            LATEST_VER="${LATEST#v}"
            if [ "$(printf '%s\n' "$CURRENT" "$LATEST_VER" | sort -V | head -n1)" = "$CURRENT" ] && [ "$CURRENT" != "$LATEST_VER" ]; then
              echo "ERROR: meta.json version ($CURRENT) is behind latest tag ($LATEST)."
              echo "   The version was likely edited manually. Align meta.json before bumping."
              exit 1
            fi
          fi

          NEW_VERSION=$(node -e "
            const v = '$CURRENT'.split('.').map(Number);
            if ('$BUMP' === 'major') { v[0]++; v[1] = 0; v[2] = 0; }
            else if ('$BUMP' === 'minor') { v[1]++; v[2] = 0; }
            else { v[2]++; }
            console.log('v' + v.join('.'));
          ")
          VERSION_NUMBER="${NEW_VERSION#v}"
          node scripts/update-meta-version.js "$VERSION_NUMBER"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin HEAD
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tag (re-release and tag-push paths)
        if: steps.tag.outputs.bumped == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag matches meta.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          FILE_VERSION=$(node -p "require('./meta.json').version")
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Version mismatch: tag is v${TAG_VERSION} but meta.json has ${FILE_VERSION}"
            echo "   Use the Release workflow (bump input) to create tags - do not push tags manually."
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches meta.json (${FILE_VERSION})"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/userscript.user.js
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "### Release created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bump:** \`${{ github.event.inputs.bump || 'tag push' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY