name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check GM API grants
        run: npm run check-grants

      - name: Check duplicate code
        run: npm run check-duplicates

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build userscript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: userscript
          path: dist/userscript.user.js

  markdown-links:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the workflow if links break

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check markdown links
        run: npm run check-links
        env:
          GITHUB_TOKEN: ${{ github.token }}

  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version is not lower than main
        run: |
          CHANGED=$(git diff origin/main...HEAD -- meta.json | grep '"version"' | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "Version unchanged in this PR, nothing to check"
            exit 0
          fi

          PR_VER=$(node -p "require('./meta.json').version")
          MAIN_VER=$(git show origin/main:meta.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")

          echo "main: $MAIN_VER"
          echo "PR:   $PR_VER"

          if [ "$(printf '%s\n' "$PR_VER" "$MAIN_VER" | sort -V | head -n1)" = "$PR_VER" ] && [ "$PR_VER" != "$MAIN_VER" ]; then
            echo "ERROR: Version regression: PR version ($PR_VER) is lower than main ($MAIN_VER)"
            echo "   Do not manually edit the version. Use the Release workflow (bump input) instead."
            exit 1
          fi

          echo "Version OK (equal or higher than main)"